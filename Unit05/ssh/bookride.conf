# =============================================================================
# Book&Ride - Unit 05 - hardening of sshd (sheet 19 "configure /etc/ssh/sshd_config")
# Read from /etc/ssh/sshd_config.d/: the first value found wins in sshd.
# =============================================================================
HostKey /etc/ssh/keys/ssh_host_ed25519_key   # created at first start (entrypoint.sh)
PermitRootLogin no              # never log in as root
PasswordAuthentication no       # keys only: sheet 23 advice "use SSH key pairs"
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers student              # nobody else
MaxAuthTries 3
LogLevel VERBOSE                # every login (and the key fingerprint) in the logs
