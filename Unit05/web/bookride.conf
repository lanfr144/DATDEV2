# =============================================================================
# Book&Ride - Unit 05 - virtual hosts of the DEVOP2 U11 sheets
#   sheet 21: site "test" on port 80, site "temporary" on port 90, then HTTPS
#   sheet 22: HTTP -> HTTPS redirect with mod_rewrite
# ${HTTPS_HOST_PORT} is an ENVIRONMENT variable (docker-compose): Apache expands
# it at start-up, so the redirect points to the port published on the host.
# =============================================================================
Listen 90
Listen 443
ServerName localhost

# ---- port 80: site "test", redirected to HTTPS (sheet 22) ----
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs/test"
    RewriteEngine on
    RewriteCond %{HTTPS} !=on
    # the sheet writes https://%{SERVER_NAME}/$1 [R,L] (302); 301 = moved for good
    RewriteRule ^/?(.*) https://%{SERVER_NAME}:${HTTPS_HOST_PORT}/$1 [R=301,L]
</VirtualHost>

# ---- port 90: site "temporary", plain HTTP (sheet 21, first part) ----
<VirtualHost *:90>
    DocumentRoot "/usr/local/apache2/htdocs/temporary"
</VirtualHost>

# ---- port 443: site "test" in HTTPS with the self-signed certificate (sheets 20-21) ----
<VirtualHost *:443>
    DocumentRoot "/usr/local/apache2/htdocs/test"
    SSLEngine on
    SSLCertificateFile    "/certs/web.crt"
    SSLCertificateKeyFile "/certs/web.key"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    # HSTS: the browser will use HTTPS directly next time (no more redirect)
    Header always set Strict-Transport-Security "max-age=300"
</VirtualHost>
